# The respawn theme: a light portal of news and reviews - a white header
# with the main menu and a search, cards on light grey, a front page that
# leads with its first item, a dark footer; one accent colour. A list
# field's options are coloured badges in their order (a review's verdict,
# a difficulty), so it suits a site of ratings and reviews. It keeps the
# engine's regions, so blocks placed for the engine's look stay where
# they are.
name: Respawn
# favicon - the theme's icon (the site's, uploaded on Site information,
# replaces it).
favicon: /static/themes/respawn/images/respawn-icon.svg
# The theme's description (Appearance page; entity.ThemeInfo).
description: A light portal of news and reviews - a white header with the menu and a search, cards on light grey, a list field's options as coloured badges, a dark footer.
author: Kosatka
license: MIT
# version - this release (the tag vX.Y.Z without its "v"); min_version -
# the oldest engine release the theme works with.
version: 0.1.2
min_version: 0.1.0
homepage: https://github.com/kosatka-cms/kosatka-theme-respawn
tags: [light, cards, portal, responsive]
screenshot: screenshot.jpg
# default_region - where new blocks go.
default_region: sidebar
regions:
  - id: header
    label: Header
  # The whole sidebar is one region (sidebar.html), ordered by weight.
  - id: sidebar
    label: Sidebar
  # Between the page's title and its content.
  - id: content_top
    label: Content top
  - id: content_bottom
    label: Content bottom
  # Inside the node page (dynamic/page.html, forum/topic.html).
  - id: content_inline
    label: Inside content (content page)
  - id: footer
    label: Footer
  # The footer's last line (the copyright block on a new site).
  - id: footer_bottom
    label: Footer bottom line
# blocks - the blocks the theme comes with (entity.ThemeBlock): placed
# when the theme gets its layout for the first time, unless the layout
# has them.
blocks:
  - plugin: copyright
    region: footer_bottom
# settings - the theme's options on the Appearance page
# (entity.ThemeSetting).
settings:
  - id: accent
    label: Accent colour
    type: color
    default: "#d72638"
    css_var: --respawn-accent
  - id: mark
    label: The header's mark
    type: select
    default: ring
    options:
      - value: ring
        label: The theme's ring
      - value: logo
        label: The site's logo
  - id: search
    label: A search in the header
    type: bool
    default: true
