# Игровой портал: новости, обзоры, видео и страницы игр, календарь
# релизов. Всё выдумано для демо - игры, студии, новости и люди;
# картинки - собственные картинки темы (demo/images).

site:
  slogan: Новости, обзоры и видео об играх
  front_page_view: home
  # Ссылки модулей (форум, опрос, цитаты, форма) - в эти меню.
  main_menu: main
  footer_menu: footer

users:
  - pixel_kid
  - retro_anna
  - galaga_pro
  - sofa_critic
  - night_owl
  - mkim
  - speedrun_lena
  - quest_master
  - joystick_dad

image_styles:
  - name: game_cover
    label: Обложка игры
    width: 600
    height: 800
    mode: fill
    anchor: focal
    hidpi: true
  - name: game_card
    label: Карточка материала
    width: 720
    height: 405
    mode: fill
    anchor: focal
    hidpi: true

vocabularies:
  - name: platforms
    label: Платформы
    path: platforms
    terms:
      - PC
      - PlayStation 5
      - PlayStation 4
      - Xbox Series
      - Xbox One
      - Nintendo Switch
      - name: Ретро
        description: Приставки и компьютеры прошлых лет.
  - name: genres
    label: Жанры
    path: genres
    terms: [RPG, Экшен, Рогалик, Платформер, Стратегия, Симулятор, Приключение, Головоломка, Хоррор, Шутер, Гонки]
  - name: topics
    label: Темы новостей
    path: topics
    terms: [Индустрия, Железо, Анонсы, Обновления, Киберспорт]
  - name: tags
    label: Теги
    path: tags
    terms: [релизы, детективы, инди, Северный маяк, предзаказ, шутеры, портативные консоли, обновления, фестивали, демоверсии, уютные игры, ретро, железо, киберспорт, файтинги, гонки, трейлеры, рогалики, гайды, ностальгия, кооператив]

field_storages:
  - name: field_cover
    type: image
  - name: field_platforms
    type: taxonomy
    vocabulary: platforms
    multiple: true
  - name: field_genres
    type: taxonomy
    vocabulary: genres
    multiple: true
  - name: field_topic
    type: taxonomy
    vocabulary: topics
  - name: field_release
    type: date
  - name: field_developer
    type: text
  - name: field_publisher
    type: text
  - name: field_requirements
    type: text
  - name: field_game
    type: reference
    target: [game]
  - name: field_verdict
    type: list
    options:
      - {value: masterpiece, label: "★ Шедевр"}
      - {value: great, label: "✓ Отлично"}
      - {value: fine, label: "≈ Нормально"}
      - {value: miss, label: "✕ Мимо"}
  - name: field_pros
    type: text
  - name: field_cons
    type: text
  - name: field_source
    type: link
  - name: field_duration
    type: text
  - name: field_chapters
    type: text
  - name: field_tags
    type: taxonomy
    vocabulary: tags
    multiple: true

content_types:
  - name: game
    label: Игра
    description: "Страница игры: обложка, платформы, жанры, дата выхода и всё, что о ней написано."
    path: games
    comments: closed
    fields:
      - {storage: field_cover, label: Обложка, show_on_detail: true, detail_image_style: game_cover, list_image_style: game_cover, sort_order: 0, display_order: 0}
      - {storage: field_release, label: Дата выхода, show_on_detail: true, show_label: true, date_format: medium, sort_order: 10, display_order: 10}
      - {storage: field_platforms, label: Платформы, widget: checkboxes, show_on_detail: true, show_label: true, sort_order: 20, display_order: 20}
      - {storage: field_genres, label: Жанры, widget: checkboxes, show_on_detail: true, show_label: true, sort_order: 30, display_order: 30}
      - {storage: field_developer, label: Разработчик, show_on_detail: true, show_label: true, sort_order: 40, display_order: 40}
      - {storage: field_publisher, label: Издатель, show_on_detail: true, show_label: true, sort_order: 50, display_order: 50}
      - {storage: field_body, label: Об игре, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 60, display_order: 60}
      - {storage: field_requirements, label: Системные требования (PC), widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, show_label: true, sort_order: 70, display_order: 70}
  - name: review
    label: Обзор
    description: "Обзор игры с вердиктом, плюсами и минусами."
    path: reviews
    comments: open
    show_submitted: true
    show_view_count: true
    promote: true
    revisions: true
    fields:
      - {storage: field_game, label: Игра, widget: autocomplete, required: true, show_on_detail: true, show_label: true, sort_order: 0, display_order: 0}
      - {storage: field_verdict, label: Вердикт, widget: select, required: true, show_on_detail: true, show_label: true, sort_order: 10, display_order: 5}
      - {storage: field_platforms, label: Платформы, widget: checkboxes, show_on_detail: true, sort_order: 20, display_order: 6}
      - {storage: field_image, label: Картинка, show_on_detail: true, detail_image_style: article_wide, list_image_style: game_card, sort_order: 30, display_order: 1}
      - {storage: field_body, label: Текст, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 40, display_order: 10}
      - {storage: field_pros, label: Понравилось, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, show_label: true, sort_order: 50, display_order: 20}
      - {storage: field_cons, label: Не понравилось, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, show_label: true, sort_order: 60, display_order: 30}
  - name: news
    label: Новость
    description: "Короткая новость с источником."
    path: news
    comments: open
    show_submitted: true
    promote: true
    fields:
      - {storage: field_topic, label: Тема, widget: select, show_on_detail: true, sort_order: 0, display_order: 0}
      - {storage: field_game, label: Игра, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 10, display_order: 30}
      - {storage: field_image, label: Картинка, show_on_detail: true, detail_image_style: article_wide, list_image_style: game_card, sort_order: 20, display_order: 1}
      - {storage: field_body, label: Текст, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 30, display_order: 10}
      - {storage: field_source, label: Источник, show_on_detail: true, show_label: true, sort_order: 40, display_order: 20}
      - {storage: field_tags, label: Теги, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 50, display_order: 25}
  - name: video
    label: Видео
    description: "Видео: прохождения, разборы, обзоры за десять минут."
    path: video
    comments: open
    show_submitted: true
    show_view_count: true
    promote: true
    fields:
      - {storage: field_game, label: Игра, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 0, display_order: 30}
      - {storage: field_image, label: Обложка, show_on_detail: true, detail_image_style: article_wide, list_image_style: game_card, sort_order: 10, display_order: 0}
      - {storage: field_duration, label: Длительность, show_on_detail: true, show_label: true, sort_order: 20, display_order: 5}
      - {storage: field_body, label: Описание, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 30, display_order: 10}
      - {storage: field_chapters, label: Главы, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, show_label: true, sort_order: 40, display_order: 20}
  - name: blog
    label: Запись в блоге
    description: "Запись в блоге игрока: впечатления, истории, гайды. Пишут зарегистрированные пользователи."
    path: blogs
    comments: open
    show_submitted: true
    show_view_count: true
    fields:
      - {storage: field_image, label: Картинка, show_on_detail: true, detail_image_style: article_wide, list_image_style: game_card, sort_order: 0, display_order: 0}
      - {storage: field_body, label: Текст, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 10, display_order: 10}
      - {storage: field_game, label: Игра, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 20, display_order: 20}
      - {storage: field_tags, label: Теги, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 30, display_order: 30}

nodes:
  # Игры - все выдуманы.
  - key: ember_halls
    type: game
    title: Ember Halls
    ago: 400d
    views: 5400
    fields:
      field_cover: {file: images/game-ember-halls.webp}
      field_release: 2020-09-17
      field_platforms: [PC, Nintendo Switch, PlayStation 5, PlayStation 4, Xbox Series, Xbox One]
      field_genres: [Рогалик, Экшен]
      field_developer: Kiln Games
      field_publisher: Kiln Games
      field_body: |
        <p>Наследник сгоревшего королевства раз за разом пытается выбраться из его пылающих залов. Каждая попытка - новый маршрут через четыре этажа огня, благословения древних духов очага и разговоры с домочадцами, которые помнят каждую вашу смерть.</p>
      field_requirements: |
        <ul><li>Система: 64-битная</li><li>Процессор: двухъядерный, 2,4 ГГц</li><li>Память: 4 ГБ</li><li>Видеокарта: 1 ГБ видеопамяти, DirectX 10</li><li>Место: 15 ГБ</li></ul>
  - key: wild_hand
    type: game
    title: Wild Hand
    ago: 300d
    views: 6100
    fields:
      field_cover: {file: images/game-wild-hand.webp}
      field_release: 2024-02-20
      field_platforms: [PC, Nintendo Switch, PlayStation 5, PlayStation 4, Xbox Series, Xbox One]
      field_genres: [Рогалик, Стратегия]
      field_developer: Lone Ante
      field_publisher: Paper Crane
      field_body: |
        <p>Покер, в котором можно жульничать - и нужно. Собирайте комбинации, покупайте дикие карты, меняющие правила, и переживите все раунды, пока колода не превратилась в машину для очков.</p>
      field_requirements: |
        <ul><li>Процессор: любой двухъядерный</li><li>Память: 1 ГБ</li><li>Видеокарта: с поддержкой OpenGL 2.1</li><li>Место: 150 МБ</li></ul>
  - key: lantern_deep
    type: game
    title: Lantern Deep
    ago: 500d
    views: 4200
    fields:
      field_cover: {file: images/game-lantern-deep.webp}
      field_release: 2017-02-24
      field_platforms: [PC, Nintendo Switch, PlayStation 4, Xbox One]
      field_genres: [Платформер, Экшен]
      field_developer: Moss & Mortar
      field_publisher: Moss & Mortar
      field_body: |
        <p>Маленький фонарщик спускается в погребённое королевство мха и кристаллов. Огромная связанная карта, строгие бои и мир, который рассказывает свою историю без слов.</p>
  - key: willow_acres
    type: game
    title: Willow Acres
    ago: 520d
    views: 3900
    fields:
      field_cover: {file: images/game-willow-acres.webp}
      field_release: 2016-02-26
      field_platforms: [PC, Nintendo Switch, PlayStation 4, Xbox One]
      field_genres: [Симулятор]
      field_developer: Barnlight Games
      field_publisher: Barnlight Games
      field_body: |
        <p>Тётина ферма, заросшая сорняками, городок со своими жителями и шахта под холмом. Сажайте, ловите рыбу, заводите друзей - в своём темпе.</p>
  - key: clockwork_crown
    type: game
    title: Clockwork Crown
    ago: 600d
    views: 2100
    fields:
      field_cover: {file: images/game-clockwork-crown.webp}
      field_release: 1995-03-11
      field_platforms: [Ретро]
      field_genres: [RPG]
      field_developer: Quill Soft
      field_publisher: Quill Soft
      field_body: |
        <p>Классическая ролевая игра девяностых о путешествиях во времени: от каменного века до конца света. Бои прямо на карте мира и больше десятка концовок.</p>
  - key: star_vault
    type: game
    title: Star Vault
    ago: 610d
    views: 1750
    fields:
      field_cover: {file: images/game-star-vault.webp}
      field_release: 1994-03-19
      field_platforms: [Ретро]
      field_genres: [Платформер, Экшен]
      field_developer: Orbit Works
      field_publisher: Orbit Works
      field_body: |
        <p>Охотница за головами возвращается на пещерную планету за украденным образцом. Одна из игр, задавших правила целого жанра: одна большая карта, способности, открывающие новые пути, и почти никаких подсказок.</p>
  - key: summit_line
    type: game
    title: Summit Line
    ago: 450d
    views: 3300
    fields:
      field_cover: {file: images/game-summit-line.webp}
      field_release: 2018-01-25
      field_platforms: [PC, Nintendo Switch, PlayStation 4, Xbox One]
      field_genres: [Платформер]
      field_developer: Small Peak Games
      field_publisher: Small Peak Games
      field_body: |
        <p>Юная альпинистка поднимается на одинокую гору - и спорит по дороге с собственными сомнениями. Точный платформер из сотен коротких экранов, где смерть стоит секунду, а режим помощи позволяет настроить сложность под себя.</p>
      field_requirements: |
        <ul><li>Процессор: Intel Core i3 M380</li><li>Память: 2 ГБ</li><li>Видеокарта: Intel HD 4000</li><li>Место: 1,2 ГБ</li></ul>
  - key: rain_precinct
    type: game
    title: Rain Precinct
    ago: 420d
    views: 2900
    fields:
      field_cover: {file: images/game-rain-precinct.webp}
      field_release: 2019-10-15
      field_platforms: [PC, PlayStation 5, PlayStation 4, Xbox Series, Xbox One, Nintendo Switch]
      field_genres: [RPG]
      field_developer: Grey Coat Studio
      field_publisher: Grey Coat Studio
      field_body: |
        <p>Детектив просыпается в разгромленном номере отеля и не помнит даже своего имени. Ролевая игра без боёв: дюжина голосов спорит у вас в голове, а расследование убийства превращается в разговор о городе, памяти и стыде.</p>
  - key: orbit_loop
    type: game
    title: Orbit Loop
    ago: 380d
    views: 3100
    fields:
      field_cover: {file: images/game-orbit-loop.webp}
      field_release: 2019-05-28
      field_platforms: [PC, PlayStation 5, PlayStation 4, Xbox Series, Xbox One, Nintendo Switch]
      field_genres: [Приключение, Головоломка]
      field_developer: Pale Comet
      field_publisher: Lumen Interactive
      field_body: |
        <p>Маленькая солнечная система, которая гибнет каждые двадцать минут. Единственное, что сохраняется между петлями, - то, что вы узнали. Исследуйте планеты и разгадайте, что здесь случилось.</p>
  - key: card_tower
    type: game
    title: Card Tower
    ago: 360d
    views: 2400
    fields:
      field_cover: {file: images/game-card-tower.webp}
      field_release: 2019-01-23
      field_platforms: [PC, Nintendo Switch, PlayStation 4, Xbox One]
      field_genres: [Рогалик, Стратегия]
      field_developer: Tall Stack
      field_publisher: Tall Stack
      field_body: |
        <p>Карточная игра, в которой колода растёт с каждым боем. Поднимитесь на башню, выбирая путь по карте этажей, реликвии и карты, - и постарайтесь не проиграть из-за одной жадной покупки.</p>
  - key: silent_mariner
    type: game
    title: The Silent Mariner
    ago: 340d
    views: 1980
    fields:
      field_cover: {file: images/game-silent-mariner.webp}
      field_release: 2018-10-18
      field_platforms: [PC, Nintendo Switch, PlayStation 4, Xbox One]
      field_genres: [Головоломка, Приключение]
      field_developer: Harbour Ink
      field_publisher: Harbour Ink
      field_body: |
        <p>1811 год. Торговый бриг, пропавший много лет назад, приходит в порт без единой души на борту. Остались лишь разорванный судовой журнал и альбом зарисовок: восстановите, кто был в команде и что стало с каждым.</p>
  - key: gates_of_arlen
    type: game
    title: Gates of Arlen
    ago: 200d
    views: 4700
    fields:
      field_cover: {file: images/game-gates-of-arlen.webp}
      field_release: 2023-08-03
      field_platforms: [PC, PlayStation 5, Xbox Series]
      field_genres: [RPG, Стратегия]
      field_developer: Tallow Studios
      field_publisher: Tallow Studios
      field_body: |
        <p>Ролевая игра по правилам настольной игры. Пошаговые бои, где можно столкнуть врага с моста или поджечь разлитое масло, и спутники, у каждого из которых своя история и своё мнение о ваших решениях.</p>
      field_requirements: |
        <ul><li>Система: Windows 10, 64-битная</li><li>Процессор: Intel i5-4690 или AMD FX 8350</li><li>Память: 8 ГБ</li><li>Видеокарта: GTX 970 или RX 480, 4 ГБ</li><li>Место: 150 ГБ, SSD</li></ul>
  - key: ashen_throne
    type: game
    title: Ashen Throne
    ago: 260d
    views: 5200
    fields:
      field_cover: {file: images/game-ashen-throne.webp}
      field_release: 2022-02-25
      field_platforms: [PC, PlayStation 5, PlayStation 4, Xbox Series, Xbox One]
      field_genres: [RPG, Экшен]
      field_developer: Grey Ember
      field_publisher: Northgate Entertainment
      field_body: |
        <p>Открытый мир, где за каждым холмом - крепость, катакомбы или босс, к которому вы пока не готовы. Можно уйти и вернуться позже: игра почти никогда не запрещает идти, куда хочется.</p>
  - key: shifting_keep
    type: game
    title: Shifting Keep
    ago: 330d
    views: 1640
    fields:
      field_cover: {file: images/game-shifting-keep.webp}
      field_release: 2018-08-07
      field_platforms: [PC, Nintendo Switch, PlayStation 4, Xbox One]
      field_genres: [Рогалик, Платформер, Экшен]
      field_developer: Iron Pail
      field_publisher: Iron Pail
      field_body: |
        <p>Безымянный узник просыпается в островной крепости и пробивается к выходу. Быстрые бои, сотни видов оружия и залы, которые перестраиваются при каждой попытке.</p>
  - key: neon_courier
    type: game
    title: Неоновый курьер
    ago: 70d
    views: 1210
    fields:
      field_cover: {file: images/game-neon-courier.webp}
      field_release: -30d
      field_platforms: [PC, PlayStation 5, Xbox Series]
      field_genres: [Экшен, Гонки]
      field_developer: Студия "Ночной трамвай"
      field_publisher: Студия "Ночной трамвай"
      field_body: |
        <p>Курьер на электросамокате развозит посылки по неоновому мегаполису будущего. Доставка на время, погони с конкурентами и город, который меняется от заказа к заказу.</p>
  - key: subway_2049
    type: game
    title: Подземка 2049
    ago: 30d
    views: 520
    fields:
      field_cover: {file: images/game-subway-2049.webp}
      field_release: +5d
      field_platforms: [PC, Xbox Series]
      field_genres: [Шутер, Хоррор]
      field_developer: Tunnel Vision Games
      field_publisher: Tunnel Vision Games
      field_body: |
        <p>Шутер в заброшенном метро огромного города: фонарь, три патрона и шорохи за поворотом. Станции связаны в одну сеть, и маршрут через неё каждый выбирает сам.</p>
  - key: deep_harbor
    type: game
    title: Глубокая гавань
    ago: 60d
    views: 870
    fields:
      field_cover: {file: images/game-deep-harbor.webp}
      field_release: +12d
      field_platforms: [PC, PlayStation 5]
      field_genres: [Приключение, Хоррор]
      field_developer: Студия "Северный маяк"
      field_publisher: Студия "Северный маяк"
      field_body: |
        <p>Детектив о смотрителе портового маяка, где каждую ночь пропадают корабли. Улики собирают по звукам: шорохам, гудкам и голосам по радио.</p>
  - key: sky_farm
    type: game
    title: Ферма на облаках
    ago: 45d
    views: 640
    fields:
      field_cover: {file: images/game-sky-farm.webp}
      field_release: +40d
      field_platforms: [Nintendo Switch, PC]
      field_genres: [Симулятор]
      field_developer: Studio Cumulus
