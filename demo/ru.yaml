  # Обзоры.
  - key: review_wild_hand
    type: review
    title: "Обзор Wild Hand: покер, от которого невозможно оторваться"
    author: sofa_critic
    sticky: true
    ago: 2d
    views: 3120
    fields:
      field_game: wild_hand
      field_verdict: masterpiece
      field_platforms: [PC, Nintendo Switch]
      field_image: {file: images/review-wild-hand.webp}
      field_body: |
        <p>Wild Hand начинается как обычный покер и за полчаса превращается в бухгалтерию безумия: множители умножаются на множители, а дикая карта, которая казалась мусором, вдруг делает из пары двоек миллион очков.</p>
        <h2>Правила, которые хочется ломать</h2>
        <p>Каждый раунд - три стола, последний с условием, меняющим всё: то карты одной масти не считаются, то руку нельзя менять. Подстраиваться под них - главное удовольствие игры.</p>
        <p>Удивительно, сколько глубины помещается в пять карт. После десятка забегов замечаешь не масти, а вероятности, - и ловишь себя на мысли, что считаешь колоду в метро.</p>
      field_pros: |
        <ul><li>Простые правила и огромная глубина</li><li>Сотни диких карт, меняющих стратегию</li><li>Забег на полчаса - идеально для перерывов</li></ul>
      field_cons: |
        <ul><li>Высокие ставки зависят от удачи</li><li>Музыка надоедает к сотому забегу</li></ul>
    comments:
      - author: pixel_kid
        body: Купил вечером, лёг в четыре утра. Предупреждать надо!
        replies:
          - author: sofa_critic
            body: Мы предупреждали - в первом абзаце.
      - author: mkim
        body: Какая колода лучше для начала?
        replies:
          - author: galaga_pro
            body: Полосатая - лишний сброс здорово выручает.
          - author: quest_master
            body: А я бы начал с простой, лишняя рука прощает ошибки.
      - author: joystick_dad
        body: Играем с сыном по очереди, один забег - один ход. Лучшая настольная игра, которая не настольная.
  - key: review_ember_halls
    type: review
    title: "Ember Halls: почему смерть здесь - только начало"
    author: retro_anna
    ago: 9d
    views: 2480
    fields:
      field_game: ember_halls
      field_verdict: masterpiece
      field_platforms: [PC, Nintendo Switch]
      field_image: {file: images/review-ember-halls.webp}
      field_body: |
        <p>В большинстве рогаликов смерть - наказание. В Ember Halls это продолжение сюжета: вернувшись к очагу, наследник узнаёт что-то новое, а домочадцы реагируют на то, как именно он погиб.</p>
        <p>Бои быстрые и читаемые, а благословения духов складываются в сборки, которые хочется пробовать снова и снова. Озвучка и музыка - отдельное удовольствие.</p>
      field_pros: |
        <ul><li>Сюжет, который движется вместе с забегами</li><li>Отточенная боевая система</li><li>Лучшая музыка в жанре</li></ul>
      field_cons: |
        <ul><li>Под конец биомы становятся предсказуемыми</li></ul>
    comments:
      - author: night_owl
        body: Прошёл тридцать раз, и до сих пор встречаются новые реплики.
      - author: speedrun_lena
        body: Лучший рогалик для того, кто рогалики не любит. Проверено на трёх друзьях.
  - key: review_willow_acres
    type: review
    title: "Willow Acres спустя годы: всё ещё лучшая ферма"
    author: mkim
    ago: 20d
    views: 1530
    fields:
      field_game: willow_acres
      field_verdict: great
      field_platforms: [Nintendo Switch]
      field_image: {file: images/review-willow-acres.webp}
      field_body: |
        <p>Обновления превратили скромную ферму в огромную игру, но главное осталось: никуда не нужно спешить. Утро начинается с полива, вечер заканчивается у костра в городке.</p>
        <p>Кооператив добавил игре второе дыхание: один ловит рыбу, другой копает в шахте, третий спорит, где ставить курятник.</p>
      field_pros: |
        <ul><li>Спокойный темп и множество занятий</li><li>Кооператив на четверых</li></ul>
      field_cons: |
        <ul><li>Первые сезоны тянутся медленно</li></ul>
  - key: review_summit_line
    type: review
    title: "Summit Line: платформер, который умеет сочувствовать"
    author: speedrun_lena
    ago: 6d
    views: 1960
    fields:
      field_game: summit_line
      field_verdict: masterpiece
      field_platforms: [PC, Nintendo Switch]
      field_image: {file: images/review-summit-line.webp}
      field_body: |
        <p>Summit Line требует точности до кадра - и при этом не наказывает. Каждый экран - маленькая задача, смерть возвращает в его начало за секунду, а счётчик смертей в конце главы выглядит не упрёком, а медалью.</p>
        <h2>Гора как метафора</h2>
        <p>История альпинистки и её сомнений рассказана без нравоучений. Механика и сюжет говорят одно и то же: подниматься тяжело, но можно, и помощь просить не стыдно - для этого в игре есть режим помощи.</p>
      field_pros: |
        <ul><li>Безупречное управление</li><li>Честная, но высокая сложность</li><li>Трогательная история и великолепная музыка</li></ul>
      field_cons: |
        <ul><li>Дополнительные уровни - только для самых упорных</li></ul>
    comments:
      - author: pixel_kid
        body: Восьмая глава сломала мне два геймпада. Ни о чём не жалею.
        replies:
          - author: speedrun_lena
            body: Это ещё не все перья!
  - key: review_rain_precinct
    type: review
    title: "Rain Precinct: ролевая игра, где главный враг - вы сами"
    author: quest_master
    ago: 14d
    views: 1710
    fields:
      field_game: rain_precinct
      field_verdict: great
      field_platforms: [PC]
      field_image: {file: images/review-rain-precinct.webp}
      field_body: |
        <p>В Rain Precinct нет боёв, зато есть дюжина голосов в голове детектива. Рассудок подсказывает версию, Бравада советует соврать, Тяга просит выпить - и каждый из них может оказаться прав.</p>
        <p>Это игра, которую читают. Текста много, и он отличный: смешной, горький и неожиданно человечный. Провалить проверку здесь часто интереснее, чем пройти.</p>
      field_pros: |
        <ul><li>Лучшие тексты в жанре</li><li>Провал - тоже история</li><li>Город, в который веришь</li></ul>
      field_cons: |
        <ul><li>Медленное начало</li><li>Мало действия для тех, кто ждёт сражений</li></ul>
  - key: review_orbit_loop
    type: review
    title: "Orbit Loop: игра, которую можно пройти только один раз"
    author: night_owl
    ago: 11d
    views: 2050
    fields:
      field_game: orbit_loop
      field_verdict: masterpiece
      field_platforms: [PC, PlayStation 5]
      field_image: {file: images/review-orbit-loop.webp}
      field_body: |
        <p>В Orbit Loop нет новых способностей, оружия или опыта. Всё, что вы получаете, - знание. Поэтому о ней так трудно писать: любая подробность отнимает у читателя открытие.</p>
        <p>Скажем только, что двадцать минут - это очень много, если знать, куда лететь. И что за латаным-перелатаным кораблём стоит одна из лучших историй в играх.</p>
      field_pros: |
        <ul><li>Открытия, которые делаете вы сами</li><li>Каждая планета - отдельная головоломка</li><li>Финал, который запомнится</li></ul>
      field_cons: |
        <ul><li>Управление кораблём поначалу сопротивляется</li></ul>
    comments:
      - author: retro_anna
        body: Спасибо, что без спойлеров. Пошла покупать.
  - key: review_card_tower
