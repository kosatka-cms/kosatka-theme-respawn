        <p>Главное умение в Card Tower - отказываться. Не брать карту, которая выглядит сильной, не идти к сундуку, если на пути элитный враг. Хорошая колода - тонкая колода.</p>
        <p>Четыре персонажа играются совсем по-разному, а подъёмы сложности дают повод возвращаться годами.</p>
      field_pros: |
        <ul><li>Ясные правила и честный случай</li><li>Четыре непохожих персонажа</li></ul>
      field_cons: |
        <ul><li>Скромная графика</li></ul>
  - key: review_neon_courier
    type: review
    title: "\"Неоновый курьер\": красиво, быстро и пусто"
    author: sofa_critic
    ago: 25d
    views: 1420
    fields:
      field_game: neon_courier
      field_verdict: miss
      field_platforms: [PC]
      field_image: {file: images/review-neon-courier.webp}
      field_body: |
        <p>Первый час "Неонового курьера" обещает многое: светящиеся улицы, музыка из ночного радио, самокат, которым приятно управлять. Ко второму часу понимаешь, что заказы повторяются, а город за неоном пуст.</p>
        <p>Погони с конкурентами быстро надоедают, а сюжет заканчивается ровно тогда, когда становится интересным. Жаль: основа у игры хорошая.</p>
      field_pros: |
        <ul><li>Стиль и музыка</li><li>Приятное управление</li></ul>
      field_cons: |
        <ul><li>Однообразные заказы</li><li>Пустой открытый мир</li><li>Короткий сюжет</li></ul>
    comments:
