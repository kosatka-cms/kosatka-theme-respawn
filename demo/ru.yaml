  - key: video_orbit_loop_start
    type: video
    title: "Orbit Loop без спойлеров: с чего начать"
    author: night_owl
    ago: 12d
    views: 980
    fields:
      field_game: orbit_loop
      field_image: {file: images/video-orbit-loop-start.webp}
      field_duration: "9:15"
      field_body: |
        <p>Как управлять кораблём, зачем читать журнал и почему не стоит бояться умирать. Ни одного открытия не раскрываем.</p>
  - key: video_harbor_gameplay
    type: video
    title: "\"Глубокая гавань\": двадцать минут игрового процесса"
    author: retro_anna
    ago: 1d
    views: 1120
    fields:
      field_game: deep_harbor
      field_image: {file: images/video-harbor-gameplay.webp}
      field_duration: "20:04"
      field_body: |
        <p>Ночь на маяке от начала до конца: радиоэфир, пустая шлюпка и первая звуковая улика. Запись предоставлена студией.</p>

  # Статьи.
  - key: article_long_games
    type: article
    title: Почему игры стали такими длинными
    author: sofa_critic
    ago: 4d
    views: 1870
    fields:
      field_image: {file: images/article-long-games.webp}
      field_body: |
        <p>Сто часов в ролевой игре когда-то были редкостью, теперь - норма. Разбираемся, откуда берутся длинные игры и почему всё больше игроков их не заканчивают.</p>
        <p>Отчасти виновата цена: игре за полную стоимость нужно выглядеть "большой". Отчасти - открытые миры, которые проще наполнить заданиями, чем историей. А короткие игры вроде The Silent Mariner или Summit Line тем временем доказывают, что десяти часов достаточно, чтобы запомниться навсегда.</p>
    comments:
      - author: mkim
        body: Хочу игры на выходные, а не на год.
      - author: quest_master
        body: А я люблю жить в игре месяцами. Пусть будут разные.
  - key: article_metroidvania
    type: article
    title: "Метроидвания: как одна карта стала жанром"
    author: retro_anna
    ago: 16d
    views: 1260
    fields:
      field_image: {file: images/article-metroidvania.webp}
      field_body: |
        <p>Star Vault вышла в 1994 году и задала правила, по которым до сих пор делают игры: большая связанная карта, закрытые двери, способность, которая открывает путь назад. Lantern Deep и Shifting Keep - её прямые наследники.</p>
        <p>В этой статье - как устроена хорошая карта, почему возвращение в старые места не скучно и зачем жанру ощущение "я здесь уже был, но теперь могу больше".</p>
  - key: article_cozy
    type: article
    title: Почему мы любим игры про фермы
    author: joystick_dad
    ago: 22d
    views: 840
    fields:
      field_image: {file: images/article-cozy.webp}
      field_body: |
        <p>В уютных играх ничего не горит: урожай подождёт, соседи не обидятся, а единственная угроза - ворона на грядке. Мы спросили читателей, почему они возвращаются в Willow Acres годами, и собрали самые честные ответы.</p>
    comments:
      - author: pixel_kid
        body: Потому что там всё получается. В отличие от жизни.
  - key: article_save_systems
    type: article
    title: "Сохраняться или нет: короткая история сохранений"
    author: quest_master
    ago: 30d
    views: 690
    fields:
      field_image: {file: images/article-save-systems.webp}
      field_body: |
        <p>Пароли из букв и цифр, батарейка в картридже, точки сохранения и автосохранение каждые пять минут - способ сохранять прогресс всегда менял то, как мы играем. Вспоминаем, как это было.</p>

  # Блоги игроков.
  - key: blog_summit_line_feathers
    type: blog
    title: Как я собрала все перья в Summit Line и не сошла с ума
    author: speedrun_lena
    ago: 1d3h
    views: 640
    fields:
      field_image: {file: images/blog-summit-line-feathers.webp}
      field_game: summit_line
      field_tags: [гайды, рогалики]
      field_body: |
        <p>Сто пятьдесят перьев, три недели вечеров и одна сломанная кнопка прыжка. Делюсь тем, что помогло дойти до конца.</p>
        <h2>Не гонитесь за всеми сразу</h2>
        <p>Первое прохождение - просто сюжет. Перья запоминаются сами: "а вон то висело над шипами". Второй заход идёт уже по памяти.</p>
        <h2>Учите рывок вниз</h2>
        <p>Половина сложных перьев берётся рывком по диагонали вниз с прыжком в конце. Потренируйтесь на пустом экране - дальше пойдёт легче.</p>
    comments:
      - author: pixel_kid
        body: Восьмая глава - это не перья, это проверка на прочность.
        replies:
          - author: speedrun_lena
            body: Она и есть. Но после неё всё остальное кажется прогулкой.
  - key: blog_retro_weekend
    type: blog
    title: "Ретро-выходные с сыном: что зашло, а что нет"
    author: joystick_dad
    ago: 2d5h
    views: 410
    fields:
      field_image: {file: images/blog-retro-weekend.webp}
      field_game: clockwork_crown
      field_tags: [ретро, ностальгия, кооператив]
      field_body: |
        <p>Решил показать сыну игры моего детства. Он вырос на открытых мирах, так что ждал скепсиса - и получил его, но не везде.</p>
        <p>Clockwork Crown неожиданно зашёл: бои прямо на карте мира и путешествия во времени его зацепили. А вот платформеры с тремя жизнями и без сохранений вызвали искреннее возмущение.</p>
    comments:
      - author: retro_anna
        body: Три жизни и без сохранений - это и есть настоящий хоррор.
  - key: blog_wild_hand_deck
    type: blog
    title: "Wild Hand: моя самая безумная колода"
    author: mkim
    ago: 3d8h
    views: 780
    fields:
      field_image: {file: images/blog-wild-hand-deck.webp}
      field_game: wild_hand
      field_tags: [рогалики, гайды]
      field_body: |
        <p>Восьмой раунд, на руке - пара шестёрок, а счёт уходит за миллиард. Рассказываю, как собиралась эта колода и почему её больше не повторить.</p>
        <p>Главное - не жадничать в магазине: две правильные дикие карты лучше пяти случайных.</p>
    comments:
      - author: galaga_pro
        body: Миллиард на паре шестёрок - скрин или не было!
        replies:
          - author: mkim
            body: Скрин в профиле. Сам до сих пор не верю.
  - key: blog_orbit_loop_tears
    type: blog
    title: Orbit Loop заставил меня плакать над космическим кораблём
    author: night_owl
    ago: 5d
    views: 520
    fields:
      field_image: {file: images/blog-orbit-loop-tears.webp}
      field_game: orbit_loop
      field_tags: [инди]
      field_body: |
        <p>Без спойлеров: эта игра о любопытстве и о том, что делать, когда время на исходе. Последние полчаса я провёл, не дыша.</p>
        <p>Если вы ещё не играли - не читайте ничего, просто начните. Если играли - вы понимаете, о чём я.</p>
  - key: blog_coop_willow_acres
    type: blog
    title: Ферма на четверых - сто дней кооператива в Willow Acres
    author: quest_master
    ago: 8d
    views: 360
    fields:
      field_image: {file: images/blog-coop-willow-acres.webp}
      field_game: willow_acres
      field_tags: [кооператив, уютные игры]
      field_body: |
        <p>Четыре человека, одна ферма и бесконечные споры о том, где ставить курятник. Рассказываю, как мы распределили роли и что из этого вышло.</p>
        <p>Главный вывод: назначьте одного ответственного за сундуки. Иначе весенние семена окажутся в сундуке с рыбой.</p>
    comments:
      - author: sofa_critic
        body: Сундук с рыбой и семенами - классика любого кооператива.
  - key: blog_ember_halls_builds
    type: blog
    title: Пять сборок для Ember Halls, которые работают всегда
    author: galaga_pro
    ago: 12d
    views: 900
    fields:
      field_image: {file: images/blog-ember-halls-builds.webp}
      field_game: ember_halls
      field_tags: [гайды, рогалики]
      field_body: |
        <p>Не лучшие сборки, а надёжные: те, с которыми я прохожу забег почти всегда, даже с неудачными благословениями.</p>
        <ul><li>Копьё и дух грозы - молнии по всей арене</li><li>Щит и дух прилива - отбрасывание в стены</li><li>Лук и дух луны - критические выстрелы</li><li>Кулаки и дух дуба - защита и скорость</li><li>Меч и дух войны - урон по площади</li></ul>

  # Страница.
  - key: about
    type: page
    title: О проекте
    fields:
      field_body: |
        <p>Это демо-сайт движка Kosatka: игровой портал с новостями, обзорами, видео и страницами игр, форумом и опросами. Всё здесь - обычные материалы, их можно править и удалять в админке.</p>
        <p>Игры, студии, новости и все люди здесь выдуманы для демо, картинки нарисованы для него.</p>

views:
  - name: home
    label: Главная
    display_type: block
    style: list
    pager: true
    page_size: 12
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {builtin: content_type}
      - {storage: field_verdict}
      - {builtin: title, link_to: content}
      - {builtin: created_at, date_format: medium}
      - {storage: field_body, trim_length: 200}
      - {builtin: comment_count, show_label: true}
    filters:
      - {builtin: status, operator: eq, value: "1"}
      - {builtin: promote, operator: eq, value: "1"}
      - {builtin: on_moderation, operator: eq, value: "0"}
    sorts:
      - {builtin: sticky, direction: desc}
      - {builtin: created_at, direction: desc}
  - name: reviews
    label: Обзоры
    display_type: page
    path: reviews
    style: grid
    grid_columns: 3
    pager: true
    page_size: 12
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {storage: field_verdict}
      - {builtin: title, link_to: content}
      - {storage: field_platforms, tag_format: plain}
      - {builtin: comment_count, show_label: true}
    filters:
      - {builtin: content_type, operator: in, value: review}
      - {builtin: status, operator: eq, value: "1"}
      - {storage: field_platforms, operator: eq, exposed: platform, exposed_label: Платформа}
      - {storage: field_verdict, operator: in, exposed: verdict, exposed_label: Вердикт}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: news
    label: Новости
    display_type: page
    path: news
    style: list
    pager: true
    page_size: 15
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {storage: field_topic, tag_format: badges}
      - {builtin: title, link_to: content}
      - {builtin: created_at, date_format: medium}
      - {storage: field_body, trim_length: 160}
    filters:
      - {builtin: content_type, operator: in, value: news}
      - {builtin: status, operator: eq, value: "1"}
      - {storage: field_topic, operator: eq, exposed: topic, exposed_label: Тема}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: videos
    label: Видео
    display_type: page
    path: video
    style: grid
    grid_columns: 3
    pager: true
    page_size: 12
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {builtin: title, link_to: content}
      - {storage: field_duration}
      - {builtin: view_count, show_label: true}
    filters:
      - {builtin: content_type, operator: in, value: video}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: articles
    label: Статьи
    display_type: page
    path: articles
    style: list
    pager: true
    page_size: 12
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {builtin: title, link_to: content}
      - {builtin: author}
      - {builtin: created_at, date_format: medium}
      - {storage: field_body, trim_length: 200}
    filters:
      - {builtin: content_type, operator: in, value: article}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: games
    label: Игры
    display_type: page
    path: games
    style: grid
    grid_columns: 4
    pager: true
    page_size: 24
    fields:
      - {storage: field_cover, image_style: game_cover, link_to: content}
      - {builtin: title, link_to: content}
      - {builtin: ratings.rating, params: {look: full}}
      - {storage: field_release, date_format: medium}
      - {storage: field_genres, tag_format: plain}
    filters:
      - {builtin: content_type, operator: in, value: game}
      - {builtin: status, operator: eq, value: "1"}
      - {storage: field_platforms, operator: eq, exposed: platform, exposed_label: Платформа}
      - {storage: field_genres, operator: eq, exposed: genre, exposed_label: Жанр}
    sorts:
      - {builtin: ratings.weighted, direction: desc, params: {min_votes: "3"}, exposed: rating, exposed_label: По рейтингу}
      - {storage: field_release, direction: desc, exposed: new, exposed_label: Сначала новые}
      - {builtin: title, direction: asc, exposed: title, exposed_label: По названию}
      - {builtin: title, direction: asc}
  - name: releases
    label: Календарь релизов
    display_type: page
    path: releases
    style: list
    pager: true
    page_size: 30
    group_by: field_release
    group_date_format: month
    fields:
      - {storage: field_cover, image_style: game_cover, link_to: content}
      - {builtin: title, link_to: content}
      - {storage: field_release, date_format: medium}
      - {storage: field_platforms, tag_format: plain}
    filters:
      - {builtin: content_type, operator: in, value: game}
      - {builtin: status, operator: eq, value: "1"}
      - {storage: field_release, operator: not_ended}
    sorts:
      - {storage: field_release, direction: asc}
  - name: game_materials
    label: Материалы об игре
    display_type: attachment
    attach_types: [game]
    attach_title: Материалы об игре
    style: list
    page_size: 20
    fields:
      - {builtin: content_type}
      - {builtin: title, link_to: content}
      - {builtin: created_at, date_format: medium}
    filters:
      - {storage: field_game, operator: related_to_current, contextual: true}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: popular
    label: Популярное
    display_type: block
    style: list
    page_size: 5
    fields:
      - {builtin: title, link_to: content}
      - {builtin: view_count, show_label: true}
    filters:
      - {builtin: content_type, operator: in, value: "review,news,video,article"}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: views, direction: desc}
  - name: blogs
    label: Блоги
    display_type: page
    path: blogs
    style: list
    pager: true
    page_size: 12
    header: "<p>Пишут игроки: впечатления, истории, гайды. Завести свой блог может любой зарегистрированный - кнопка \"Создать материал\" в меню пользователя.</p>"
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {builtin: title, link_to: content}
      - {builtin: author, link_to: author}
      - {builtin: created_at, date_format: medium}
      - {storage: field_body, trim_length: 180}
      - {storage: field_tags, tag_format: plain}
      - {builtin: comment_count, show_label: true}
    filters:
      - {builtin: content_type, operator: in, value: blog}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: user_blog
    label: Блог
    display_type: user_tab
    tab_path: blog
    style: list
    pager: true
    page_size: 10
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {builtin: title, link_to: content}
      - {builtin: created_at, date_format: medium}
      - {storage: field_body, trim_length: 180}
    filters:
      - {builtin: content_type, operator: in, value: blog}
      - {builtin: status, operator: eq, value: "1"}
      - {builtin: created_by, operator: eq, contextual: true}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: blogs_latest
    label: Блоги игроков
    display_type: block
    style: list
    page_size: 4
    fields:
      - {builtin: title, link_to: content}
      - {builtin: author}
    filters:
      - {builtin: content_type, operator: in, value: blog}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: top_games
    label: Лучшие игры
    display_type: block
    style: list
    page_size: 5
    fields:
      - {builtin: title, link_to: content}
      - {builtin: ratings.rating, params: {look: average}}
    filters:
      - {builtin: content_type, operator: in, value: game}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: ratings.weighted, direction: desc, params: {min_votes: "3"}}
  - name: upcoming
    label: Скоро выйдут
    display_type: block
    style: list
    page_size: 5
    fields:
      - {builtin: title, link_to: content}
      - {storage: field_release, date_format: medium}
    filters:
      - {builtin: content_type, operator: in, value: game}
      - {builtin: status, operator: eq, value: "1"}
      - {storage: field_release, operator: not_ended}
    sorts:
      - {storage: field_release, direction: asc}

blocks:
  - {region: sidebar, view: popular, title: Популярное, show_title: true}
  - {region: sidebar, view: upcoming, title: Скоро выйдут, show_title: true}
  - {region: sidebar, plugin: last_comments, title: Обсуждают}
  - {region: sidebar, plugin: tag_cloud, vocabulary: genres, title: Жанры, show_title: true, config: {count: "12"}}
  - {region: sidebar, view: blogs_latest, title: Блоги игроков, show_title: true, visibility: homepage}
  - {region: sidebar, view: top_games, title: Лучшие игры, show_title: true, types: [game]}
  - {region: sidebar, plugin: tag_cloud, vocabulary: tags, title: Теги, show_title: true, types: [news, blog], config: {count: "20"}}

menus:
  - name: main
    links:
      - {title: Новости, view: news}
      - {title: Обзоры, view: reviews}
      - {title: Видео, view: videos}
      - {title: Статьи, view: articles}
      - {title: Блоги, view: blogs}
      - {title: Игры, view: games}
      - {title: Релизы, view: releases}
  - name: footer
    label: Подвал
    region: footer
    links:
      - {title: О проекте, node: about}

# Права ролей сверх стартовых: пользователи ведут блоги.
permissions:
  user: [create blog content, edit own blog content, use_text_format_basic_html]

# Демо-содержимое модулей - в формате их demo/<язык>.json. Модули ставятся
# вместе с набором (app install без -modules); сайт, собранный без модуля
# форума (модуль из своего репозитория), ставится без его части.
modules:
  forum:
    vocabulary: Форум
    menu: Форум
    categories:
      - name: Игры
        description: Всё об играх, во что вы играете.
        sections:
          - {name: Обсуждение игр, description: "Впечатления, споры и рекомендации."}
          - {name: Помогите пройти, description: "Застряли - спросите, здесь подскажут без лишних спойлеров."}
      - name: Железо
        description: ПК, консоли, геймпады и всё, на чём играют.
        sections:
          - {name: ПК и консоли, description: "Сборки, апгрейды, выбор консоли."}
      - name: Флудилка
        description: Разговоры не об играх. Ну, почти.
        sections:
          - {name: Свободная тема, description: "Кино, книги, жизнь."}
    topics:
      - section: Обсуждение игр
        title: Правила форума
        author: galaga_pro
        sticky: true
        views: 1200
        body: "<p>Спойлеры прячем под предупреждение, к собеседникам относимся по-человечески. Вопрос о прохождении - в \"Помогите пройти\".</p>"
        replies: []
      - section: Помогите пройти
        title: "Orbit Loop: не могу попасть внутрь кометы"
        author: joystick_dad
        views: 340
        body: "<p>Подлетаю, облетаю вокруг, а входа не вижу. Только намекните, без ответа!</p>"
        replies:
          - author: night_owl
            body: "Намёк: обратите внимание, когда именно вы туда прилетаете."
            replies:
              - author: joystick_dad
                body: Получилось! Спасибо, что не раскрыли.
      - section: Обсуждение игр
        title: Лучший рогалик для новичка?
        author: mkim
        views: 520
        body: "<p>Хочу попробовать жанр, но боюсь, что брошу через час. С чего начать?</p>"
        replies:
          - author: retro_anna
            body: Ember Halls - смерть там двигает сюжет, бросить сложно.
          - author: galaga_pro
            body: Wild Hand, если любите карты. Card Tower, если любите думать.
            replies:
              - author: mkim
                body: Взял Wild Hand. Кажется, это была ошибка - уже три ночи не сплю.
      - section: ПК и консоли
        title: Портативная консоль или ноутбук для поездок?
        author: speedrun_lena
        views: 410
        body: "<p>Часто езжу в поездах. Что удобнее для игр в дороге?</p>"
        replies:
          - author: pixel_kid
            body: Портативка. Ноутбук на коленях в купе - так себе удовольствие.
          - author: quest_master
            body: Зависит от игр. Стратегии на портативке - боль.
      - section: Свободная тема
        title: Какие саундтреки слушаете вне игр?
        author: sofa_critic
        views: 260
        body: "<p>У меня в плеере половина - музыка из игр. Делитесь своими.</p>"
        replies:
          - author: speedrun_lena
            body: Summit Line. Под неё отлично работается.
          - author: night_owl
            body: Orbit Loop, но только когда грустно.
