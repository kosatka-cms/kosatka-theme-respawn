      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: views, direction: desc}
  - name: blogs
    label: Blogs
    display_type: page
    path: blogs
    style: list
    pager: true
    page_size: 12
    header: "<p>Written by players: impressions, stories, guides. Any registered member can start a blog - \"Create content\" in the user menu.</p>"
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {builtin: title, link_to: content}
      - {builtin: author, link_to: author}
      - {builtin: created_at, date_format: medium}
      - {storage: field_body, trim_length: 180}
      - {storage: field_tags, tag_format: plain}
      - {builtin: comment_count, show_label: true}
    filters:
      - {builtin: content_type, operator: in, value: blog}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: user_blog
    label: Blog
    display_type: user_tab
    tab_path: blog
    style: list
    pager: true
    page_size: 10
    fields:
      - {storage: field_image, image_style: game_card, link_to: content}
      - {builtin: title, link_to: content}
      - {builtin: created_at, date_format: medium}
      - {storage: field_body, trim_length: 180}
    filters:
      - {builtin: content_type, operator: in, value: blog}
      - {builtin: status, operator: eq, value: "1"}
      - {builtin: created_by, operator: eq, contextual: true}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: blogs_latest
    label: Players' blogs
    display_type: block
