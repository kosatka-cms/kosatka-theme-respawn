      - {name: link, type: text, label: Link to the source}
      - {name: message, type: textarea, label: What happened, required: true}
    submissions:
      - author: pixel_kid
        values: {name: Pixel, email: pixel_kid@example.com, topic: Announcement, link: "https://example.com/rumor", message: "They say \"Deep Harbor\" will have a mode for two."}
