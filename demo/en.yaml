# The roles' permissions beyond the starter's: members keep blogs.
permissions:
  user: [create blog content, edit own blog content, use_text_format_basic_html]

# The modules' demo content, in the format of their demo/<lang>.json. The
# modules are installed with the set (app install without -modules); a
# site built without the forum module (a module of its own repository)
# installs without its part.
modules:
  forum:
    vocabulary: Forum
    menu: Forum
    categories:
      - name: Games
        description: All about games, what you're playing.
        sections:
          - {name: Talking games, description: "Impressions, arguments and recommendations."}
          - {name: Help me through, description: "Stuck? Ask - you'll get a hint without needless spoilers."}
      - name: Hardware
        description: PCs, consoles, gamepads and everything people play on.
        sections:
          - {name: PCs and consoles, description: "Builds, upgrades, choosing a console."}
      - name: Off-topic
        description: Talk that isn't about games. Well, almost.
        sections:
          - {name: Anything goes, description: "Films, books, life."}
    topics:
      - section: Talking games
        title: The forum's rules
        author: galaga_pro
        sticky: true
        views: 1200
        body: "<p>Hide spoilers behind a warning, treat each other like people. Questions about getting through a game go to \"Help me through\".</p>"
        replies: []
      - section: Help me through
        title: "Orbit Loop: I can't get inside the comet"
        author: joystick_dad
        views: 340
        body: "<p>I fly up, circle around it and can't see the way in. Just a hint, not the answer!</p>"
        replies:
          - author: night_owl
            body: "A hint: pay attention to when exactly you get there."
            replies:
              - author: joystick_dad
                body: Got it! Thanks for not giving it away.
      - section: Talking games
        title: The best roguelike for a beginner?
        author: mkim
        views: 520
        body: "<p>I'd like to try the genre but I'm afraid I'll quit after an hour. Where do I start?</p>"
        replies:
          - author: retro_anna
            body: Ember Halls - dying moves the story on, it's hard to quit.
          - author: galaga_pro
            body: Wild Hand if you like cards. Card Tower if you like to think.
            replies:
              - author: mkim
                body: Took Wild Hand. Looks like a mistake - three nights without sleep already.
      - section: PCs and consoles
        title: A handheld or a laptop for travel?
        author: speedrun_lena
        views: 410
        body: "<p>I travel by train a lot. What's handier for playing on the road?</p>"
        replies:
          - author: pixel_kid
            body: A handheld. A laptop on your knees in a compartment is not much fun.
          - author: quest_master
            body: Depends on the games. Strategy on a handheld is pain.
      - section: Anything goes
        title: Which soundtracks do you listen to outside games?
        author: sofa_critic
        views: 260
        body: "<p>Half of my player is music from games. Share yours.</p>"
        replies:
          - author: speedrun_lena
            body: Summit Line. Great to work to.
          - author: night_owl
            body: Orbit Loop, but only when I'm sad.
  polls:
    title: What are you playing this weekend?
    description: "<p>Something new, an old love or a break from games - tell us.</p>"
    options:
      - Something new
      - An old favourite
      - Still Wild Hand
      - Taking a break from games
    votes: {pixel_kid: 2, retro_anna: 1, galaga_pro: 2, sofa_critic: 0, night_owl: 1, mkim: 2, speedrun_lena: 0, quest_master: 1, joystick_dad: 3}
    comments:
      - author: joystick_dad
        body: Taking a break means watching the kids play.
    menu: Poll
    block: Poll of the week
  galleries:
    node: review_orbit_loop
    title: The solar system on screen
    description: Shots from our playthrough - no spoilers.
    pictures:
      - {title: The campfire at the landing, file: images/gallery-campfire.webp}
      - {title: The observatory, file: images/gallery-observatory.webp}
      - {title: The cracked planet, file: images/gallery-planet.webp}
      - {title: The storm ocean, file: images/gallery-ocean.webp}
      - {title: The drifting moon, file: images/gallery-moon.webp}
      - {title: The ship taking off, file: images/gallery-launch.webp}
  ratings:
    types: [game]
    votes:
      - {node: ember_halls, scores: {pixel_kid: 5, retro_anna: 5, galaga_pro: 5, sofa_critic: 4, night_owl: 5, mkim: 4, speedrun_lena: 5}}
      - {node: wild_hand, scores: {pixel_kid: 5, galaga_pro: 5, sofa_critic: 5, mkim: 5, quest_master: 4, joystick_dad: 4}}
      - {node: lantern_deep, scores: {retro_anna: 5, galaga_pro: 4, night_owl: 5, speedrun_lena: 5, pixel_kid: 4}}
      - {node: willow_acres, scores: {mkim: 5, joystick_dad: 5, quest_master: 4, sofa_critic: 4}}
      - {node: clockwork_crown, scores: {retro_anna: 5, joystick_dad: 5, quest_master: 5}}
      - {node: star_vault, scores: {retro_anna: 5, galaga_pro: 4}}
      - {node: summit_line, scores: {speedrun_lena: 5, pixel_kid: 5, night_owl: 4, mkim: 4}}
      - {node: rain_precinct, scores: {quest_master: 5, sofa_critic: 4, night_owl: 4}}
      - {node: orbit_loop, scores: {night_owl: 5, retro_anna: 5, joystick_dad: 4, sofa_critic: 5}}
      - {node: card_tower, scores: {galaga_pro: 5, mkim: 4, quest_master: 4}}
      - {node: silent_mariner, scores: {night_owl: 5, sofa_critic: 4, retro_anna: 4}}
      - {node: gates_of_arlen, scores: {quest_master: 5, sofa_critic: 5, joystick_dad: 4, mkim: 5, galaga_pro: 4}}
      - {node: ashen_throne, scores: {galaga_pro: 5, pixel_kid: 4, night_owl: 4, speedrun_lena: 3}}
      - {node: shifting_keep, scores: {pixel_kid: 4, speedrun_lena: 4, galaga_pro: 3}}
