      - {storage: field_release, date_format: medium}
      - {storage: field_genres, tag_format: plain}
    filters:
      - {builtin: content_type, operator: in, value: game}
      - {builtin: status, operator: eq, value: "1"}
      - {storage: field_platforms, operator: eq, exposed: platform, exposed_label: Platform}
      - {storage: field_genres, operator: eq, exposed: genre, exposed_label: Genre}
    sorts:
      - {builtin: ratings.weighted, direction: desc, params: {min_votes: "3"}, exposed: rating, exposed_label: By rating}
      - {storage: field_release, direction: desc, exposed: new, exposed_label: Newest first}
      - {builtin: title, direction: asc, exposed: title, exposed_label: By title}
      - {builtin: title, direction: asc}
  - name: releases
    label: Release calendar
    display_type: page
    path: releases
    style: list
    pager: true
    page_size: 30
    group_by: field_release
    group_date_format: month
    fields:
      - {storage: field_cover, image_style: game_cover, link_to: content}
      - {builtin: title, link_to: content}
      - {storage: field_release, date_format: medium}
      - {storage: field_platforms, tag_format: plain}
    filters:
      - {builtin: content_type, operator: in, value: game}
      - {builtin: status, operator: eq, value: "1"}
      - {storage: field_release, operator: not_ended}
    sorts:
      - {storage: field_release, direction: asc}
  - name: game_materials
    label: About the game
    display_type: attachment
    attach_types: [game]
    attach_title: About the game
    style: list
    page_size: 20
    fields:
      - {builtin: content_type}
      - {builtin: title, link_to: content}
      - {builtin: created_at, date_format: medium}
    filters:
      - {storage: field_game, operator: related_to_current, contextual: true}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: popular
    label: Popular
    display_type: block
    style: list
    page_size: 5
