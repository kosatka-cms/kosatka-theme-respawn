  # The articles.
  - key: article_long_games
    type: article
    title: Why games have got so long
    author: sofa_critic
    ago: 4d
    views: 1870
    fields:
      field_image: {file: images/article-long-games.webp}
      field_body: |
        <p>A hundred hours in a role-playing game was once rare; now it's the norm. We look at where long games come from and why more and more players never finish them.</p>
        <p>Partly it's the price: a full-price game has to look "big". Partly it's open worlds, easier to fill with quests than with a story. Meanwhile short games like The Silent Mariner or Summit Line prove that ten hours are enough to be remembered forever.</p>
    comments:
      - author: mkim
        body: I want games for a weekend, not for a year.
      - author: quest_master
        body: And I love living in a game for months. Let there be both.
  - key: article_metroidvania
    type: article
    title: "The metroidvania: how one map became a genre"
    author: retro_anna
    ago: 16d
    views: 1260
    fields:
      field_image: {file: images/article-metroidvania.webp}
      field_body: |
        <p>Star Vault came out in 1994 and set the rules games are still made by: a big interconnected map, locked doors, an ability that opens the way back. Lantern Deep and Shifting Keep are its direct heirs.</p>
        <p>In this article: how a good map is built, why going back to old places isn't boring, and why the genre needs the feeling "I've been here before, but now I can do more".</p>
  - key: article_cozy
    type: article
    title: Why we love farming games
    author: joystick_dad
    ago: 22d
    views: 840
    fields:
      field_image: {file: images/article-cozy.webp}
      field_body: |
        <p>Nothing is urgent in cozy games: the harvest will wait, the neighbours won't take offence, and the only threat is a crow in the garden. We asked readers why they keep coming back to Willow Acres for years and gathered the most honest answers.</p>
    comments:
      - author: pixel_kid
        body: Because everything works out there. Unlike life.
  - key: article_save_systems
    type: article
    title: "To save or not: a short history of saving"
    author: quest_master
    ago: 30d
    views: 690
    fields:
      field_image: {file: images/article-save-systems.webp}
      field_body: |
        <p>Passwords of letters and digits, a battery in the cartridge, save points and an autosave every five minutes - the way we keep our progress has always changed the way we play. Remembering how it was.</p>

  # The players' blogs.
  - key: blog_summit_line_feathers
    type: blog
    title: How I collected every feather in Summit Line and kept my sanity
    author: speedrun_lena
    ago: 1d3h
    views: 640
    fields:
      field_image: {file: images/blog-summit-line-feathers.webp}
      field_game: summit_line
      field_tags: [guides, roguelikes]
      field_body: |
        <p>A hundred and fifty feathers, three weeks of evenings and one broken jump button. Here's what helped me get to the end.</p>
        <h2>Don't chase them all at once</h2>
        <p>The first playthrough is just the story. The feathers stick in your memory on their own: "that one hung over the spikes". The second time round you go by memory.</p>
        <h2>Learn the downward dash</h2>
        <p>Half of the hard feathers are taken with a diagonal dash down and a jump at the end. Practise it on an empty screen - it gets easier from there.</p>
    comments:
      - author: pixel_kid
        body: Chapter eight isn't feathers, it's an endurance test.
        replies:
          - author: speedrun_lena
            body: It is. But after it everything else feels like a walk.
  - key: blog_retro_weekend
    type: blog
    title: "A retro weekend with my son: what worked and what didn't"
    author: joystick_dad
    ago: 2d5h
    views: 410
    fields:
      field_image: {file: images/blog-retro-weekend.webp}
      field_game: clockwork_crown
      field_tags: [retro, nostalgia, co-op]
      field_body: |
        <p>I decided to show my son the games of my childhood. He grew up on open worlds, so I expected scepticism - and got it, but not everywhere.</p>
        <p>Clockwork Crown unexpectedly worked: battles on the world map itself and time travel hooked him. Platformers with three lives and no saves, though, caused sincere outrage.</p>
    comments:
      - author: retro_anna
        body: Three lives and no saves - now that's real horror.
  - key: blog_wild_hand_deck
    type: blog
    title: "Wild Hand: my craziest deck"
    author: mkim
    ago: 3d8h
    views: 780
    fields:
      field_image: {file: images/blog-wild-hand-deck.webp}
      field_game: wild_hand
      field_tags: [roguelikes, guides]
      field_body: |
        <p>The eighth round, a pair of sixes in hand, and the score goes past a billion. Here's how this deck came together and why it can never be repeated.</p>
        <p>The main thing is not to be greedy in the shop: two right wild cards beat five random ones.</p>
    comments:
      - author: galaga_pro
        body: A billion on a pair of sixes - screenshot or it didn't happen!
        replies:
          - author: mkim
            body: The screenshot is in my profile. I still can't believe it myself.
  - key: blog_orbit_loop_tears
    type: blog
    title: Orbit Loop made me cry over a spaceship
    author: night_owl
    ago: 5d
    views: 520
    fields:
      field_image: {file: images/blog-orbit-loop-tears.webp}
      field_game: orbit_loop
      field_tags: [indie]
      field_body: |
        <p>No spoilers: this game is about curiosity and about what to do when time is running out. I spent the last half hour holding my breath.</p>
        <p>If you haven't played it - don't read anything, just start. If you have - you know what I mean.</p>
  - key: blog_coop_willow_acres
    type: blog
    title: A farm for four - a hundred days of co-op in Willow Acres
    author: quest_master
    ago: 8d
    views: 360
    fields:
      field_image: {file: images/blog-coop-willow-acres.webp}
      field_game: willow_acres
      field_tags: [co-op, cozy games]
      field_body: |
        <p>Four people, one farm and endless arguments about where the chicken coop should go. Here's how we split the roles and what came of it.</p>
        <p>The main lesson: put one person in charge of the chests. Otherwise the spring seeds end up in the chest with the fish.</p>
    comments:
      - author: sofa_critic
        body: A chest of fish and seeds - a classic of every co-op.
  - key: blog_ember_halls_builds
    type: blog
    title: Five Ember Halls builds that always work
    author: galaga_pro
    ago: 12d
    views: 900
    fields:
      field_image: {file: images/blog-ember-halls-builds.webp}
      field_game: ember_halls
      field_tags: [guides, roguelikes]
      field_body: |
        <p>Not the best builds, but reliable ones: those I almost always finish a run with, even with bad blessings.</p>
        <ul><li>The spear and the storm spirit - lightning all over the arena</li><li>The shield and the tide spirit - knocking enemies into walls</li><li>The bow and the moon spirit - critical shots</li><li>The fists and the oak spirit - defence and speed</li><li>The sword and the war spirit - area damage</li></ul>

  # A page.
  - key: about
    type: page
    title: About
    fields:
      field_body: |
        <p>This is a demo site of the Kosatka engine and its Respawn theme: a game portal with news, reviews, videos and game pages, a forum and polls. Everything here is ordinary content, changed and deleted in the admin.</p>
        <p>The games, the studios, the news and the people here are all made up for the demo; the pictures are drawn for it.</p>

