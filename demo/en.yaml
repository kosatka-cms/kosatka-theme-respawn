  forms:
    title: Suggest a story
    description: Know something we don't? Tell us - we'll check it and write about it.
    confirmation: Thank you! The editors will read it and reply by e-mail.
    submit: Send
    elements:
      - {name: name, type: text, label: Name, required: true}
      - {name: email, type: email, label: E-mail, required: true}
