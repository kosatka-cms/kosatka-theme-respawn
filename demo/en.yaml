      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: created_at, direction: desc}
  - name: top_games
    label: Top games
    display_type: block
    style: list
    page_size: 5
    fields:
      - {builtin: title, link_to: content}
      - {builtin: ratings.rating, params: {look: average}}
    filters:
      - {builtin: content_type, operator: in, value: game}
      - {builtin: status, operator: eq, value: "1"}
    sorts:
      - {builtin: ratings.weighted, direction: desc, params: {min_votes: "3"}}
  - name: upcoming
    label: Coming soon
    display_type: block
    style: list
    page_size: 5
    fields:
      - {builtin: title, link_to: content}
      - {storage: field_release, date_format: medium}
    filters:
      - {builtin: content_type, operator: in, value: game}
      - {builtin: status, operator: eq, value: "1"}
      - {storage: field_release, operator: not_ended}
    sorts:
      - {storage: field_release, direction: asc}

