# A game portal: news, reviews, videos and game pages, a release
# calendar. Everything is made up for the demo - the games, the studios,
# the news and the people; the pictures are the theme's own (demo/images).

site:
  slogan: News, reviews and videos about games
  front_page_view: home
  # The modules' links (forum, poll, quotes, form) go in these menus.
  main_menu: main
  footer_menu: footer

users:
  - pixel_kid
  - retro_anna
  - galaga_pro
  - sofa_critic
  - night_owl
  - mkim
  - speedrun_lena
  - quest_master
  - joystick_dad

image_styles:
  - name: game_cover
    label: Game cover
    width: 600
    height: 800
    mode: fill
    anchor: focal
    hidpi: true
  - name: game_card
    label: Card
    width: 720
    height: 405
    mode: fill
    anchor: focal
    hidpi: true

vocabularies:
  - name: platforms
    label: Platforms
    path: platforms
    terms:
      - PC
      - PlayStation 5
      - PlayStation 4
      - Xbox Series
      - Xbox One
      - Nintendo Switch
      - name: Retro
        description: Consoles and computers of years past.
  - name: genres
    label: Genres
    path: genres
    terms: [RPG, Action, Roguelike, Platformer, Strategy, Simulation, Adventure, Puzzle, Horror, Shooter, Racing]
  - name: topics
    label: News topics
    path: topics
    terms: [Industry, Hardware, Announcements, Updates, Esports]
  - name: tags
    label: Tags
    path: tags
    terms: [releases, detective, indie, North Lighthouse, pre-orders, shooters, handhelds, updates, festivals, demos, cozy games, retro, hardware, esports, fighting games, racing, trailers, roguelikes, guides, nostalgia, co-op]

field_storages:
  - name: field_cover
    type: image
  - name: field_platforms
    type: taxonomy
    vocabulary: platforms
    multiple: true
  - name: field_genres
    type: taxonomy
    vocabulary: genres
    multiple: true
  - name: field_topic
    type: taxonomy
    vocabulary: topics
  - name: field_release
    type: date
  - name: field_developer
    type: text
  - name: field_publisher
    type: text
  - name: field_requirements
    type: text
  - name: field_game
    type: reference
    target: [game]
  - name: field_verdict
    type: list
    options:
      - {value: masterpiece, label: "★ Masterpiece"}
      - {value: great, label: "✓ Great"}
      - {value: fine, label: "≈ Fine"}
      - {value: miss, label: "✕ Miss"}
  - name: field_pros
    type: text
  - name: field_cons
    type: text
  - name: field_source
    type: link
  - name: field_duration
    type: text
  - name: field_chapters
    type: text
  - name: field_tags
    type: taxonomy
    vocabulary: tags
    multiple: true

content_types:
  - name: game
    label: Game
    description: "A game's page: its cover, platforms, genres, release date and everything written about it."
    path: games
    comments: closed
    fields:
      - {storage: field_cover, label: Cover, show_on_detail: true, detail_image_style: game_cover, list_image_style: game_cover, sort_order: 0, display_order: 0}
      - {storage: field_release, label: Release date, show_on_detail: true, show_label: true, date_format: medium, sort_order: 10, display_order: 10}
      - {storage: field_platforms, label: Platforms, widget: checkboxes, show_on_detail: true, show_label: true, sort_order: 20, display_order: 20}
      - {storage: field_genres, label: Genres, widget: checkboxes, show_on_detail: true, show_label: true, sort_order: 30, display_order: 30}
      - {storage: field_developer, label: Developer, show_on_detail: true, show_label: true, sort_order: 40, display_order: 40}
      - {storage: field_publisher, label: Publisher, show_on_detail: true, show_label: true, sort_order: 50, display_order: 50}
      - {storage: field_body, label: About the game, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 60, display_order: 60}
      - {storage: field_requirements, label: System requirements (PC), widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, show_label: true, sort_order: 70, display_order: 70}
  - name: review
    label: Review
    description: "A game's review with a verdict, its pros and cons."
    path: reviews
    comments: open
    show_submitted: true
    show_view_count: true
    promote: true
    revisions: true
    fields:
      - {storage: field_game, label: Game, widget: autocomplete, required: true, show_on_detail: true, show_label: true, sort_order: 0, display_order: 0}
      - {storage: field_verdict, label: Verdict, widget: select, required: true, show_on_detail: true, show_label: true, sort_order: 10, display_order: 5}
      - {storage: field_platforms, label: Platforms, widget: checkboxes, show_on_detail: true, sort_order: 20, display_order: 6}
      - {storage: field_image, label: Picture, show_on_detail: true, detail_image_style: article_wide, list_image_style: game_card, sort_order: 30, display_order: 1}
      - {storage: field_body, label: Text, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 40, display_order: 10}
      - {storage: field_pros, label: Liked, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, show_label: true, sort_order: 50, display_order: 20}
      - {storage: field_cons, label: Didn't like, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, show_label: true, sort_order: 60, display_order: 30}
  - name: news
    label: News
    description: "A short news item with its source."
    path: news
    comments: open
    show_submitted: true
    promote: true
    fields:
      - {storage: field_topic, label: Topic, widget: select, show_on_detail: true, sort_order: 0, display_order: 0}
      - {storage: field_game, label: Game, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 10, display_order: 30}
      - {storage: field_image, label: Picture, show_on_detail: true, detail_image_style: article_wide, list_image_style: game_card, sort_order: 20, display_order: 1}
      - {storage: field_body, label: Text, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 30, display_order: 10}
      - {storage: field_source, label: Source, show_on_detail: true, show_label: true, sort_order: 40, display_order: 20}
      - {storage: field_tags, label: Tags, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 50, display_order: 25}
  - name: video
    label: Video
    description: "A video: playthroughs, breakdowns, ten-minute reviews."
    path: video
    comments: open
    show_submitted: true
    show_view_count: true
    promote: true
    fields:
      - {storage: field_game, label: Game, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 0, display_order: 30}
      - {storage: field_image, label: Cover, show_on_detail: true, detail_image_style: article_wide, list_image_style: game_card, sort_order: 10, display_order: 0}
      - {storage: field_duration, label: Length, show_on_detail: true, show_label: true, sort_order: 20, display_order: 5}
      - {storage: field_body, label: Description, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 30, display_order: 10}
      - {storage: field_chapters, label: Chapters, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, show_label: true, sort_order: 40, display_order: 20}
  - name: blog
    label: Blog post
    description: "A player's blog post: impressions, stories, guides. Written by registered users."
    path: blogs
    comments: open
    show_submitted: true
    show_view_count: true
    fields:
      - {storage: field_image, label: Picture, show_on_detail: true, detail_image_style: article_wide, list_image_style: game_card, sort_order: 0, display_order: 0}
      - {storage: field_body, label: Text, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 10, display_order: 10}
      - {storage: field_game, label: Game, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 20, display_order: 20}
      - {storage: field_tags, label: Tags, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 30, display_order: 30}

