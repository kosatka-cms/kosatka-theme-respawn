  # The reviews.
  - key: review_wild_hand
    type: review
    title: "Wild Hand review: the poker you can't put down"
    author: sofa_critic
    sticky: true
    ago: 2d
    views: 3120
    fields:
      field_game: wild_hand
      field_verdict: masterpiece
      field_platforms: [PC, Nintendo Switch]
      field_image: {file: images/review-wild-hand.webp}
      field_body: |
        <p>Wild Hand starts as ordinary poker and in half an hour turns into the bookkeeping of madness: multipliers multiply multipliers, and a wild card that looked like rubbish suddenly turns a pair of twos into a million points.</p>
        <h2>Rules you want to break</h2>
        <p>Every round has three tables, the last with a condition that changes everything: cards of one suit don't count, or the hand can't be changed. Adapting to them is the game's main pleasure.</p>
        <p>It's amazing how much depth fits into five cards. After a dozen runs you notice probabilities, not suits - and catch yourself counting the deck on the train.</p>
      field_pros: |
        <ul><li>Simple rules, huge depth</li><li>Hundreds of wild cards that change the strategy</li><li>A half-hour run - perfect for a break</li></ul>
      field_cons: |
        <ul><li>High stakes depend on luck</li><li>The music wears thin by the hundredth run</li></ul>
    comments:
      - author: pixel_kid
        body: Bought it in the evening, went to bed at four in the morning. You should warn people!
        replies:
          - author: sofa_critic
            body: We did - in the first paragraph.
      - author: mkim
        body: Which deck is best to start with?
        replies:
          - author: galaga_pro
            body: The striped one - the extra discard helps a lot.
          - author: quest_master
            body: I'd start with the plain one, the extra hand forgives mistakes.
      - author: joystick_dad
        body: My son and I take turns, one run each. The best board game that isn't a board game.
  - key: review_ember_halls
    type: review
    title: "Ember Halls: why death is only the beginning here"
    author: retro_anna
    ago: 9d
    views: 2480
    fields:
      field_game: ember_halls
      field_verdict: masterpiece
      field_platforms: [PC, Nintendo Switch]
      field_image: {file: images/review-ember-halls.webp}
      field_body: |
        <p>In most roguelikes death is a punishment. In Ember Halls it moves the story on: back at the hearth the heir learns something new, and the household reacts to how exactly he died.</p>
        <p>The fights are fast and readable, and the spirits' blessings add up to builds you want to try again and again. The voice acting and the music are a pleasure of their own.</p>
      field_pros: |
        <ul><li>A story that moves with the runs</li><li>Polished combat</li><li>The best music in the genre</li></ul>
      field_cons: |
        <ul><li>Towards the end the biomes get predictable</li></ul>
    comments:
      - author: night_owl
        body: Finished it thirty times and still hear new lines.
      - author: speedrun_lena
        body: The best roguelike for people who don't like roguelikes. Tested on three friends.
  - key: review_willow_acres
    type: review
    title: "Willow Acres years later: still the best farm"
    author: mkim
    ago: 20d
    views: 1530
    fields:
      field_game: willow_acres
      field_verdict: great
      field_platforms: [Nintendo Switch]
      field_image: {file: images/review-willow-acres.webp}
      field_body: |
        <p>The updates have turned a modest farm into a huge game, but the main thing stays: there's no need to hurry. The morning starts with watering, the evening ends by the fire in town.</p>
        <p>Co-op gave the game a second wind: one fishes, another digs in the mine, a third argues where the chicken coop should go.</p>
      field_pros: |
        <ul><li>A calm pace and plenty to do</li><li>Co-op for four</li></ul>
      field_cons: |
        <ul><li>The first seasons drag</li></ul>
  - key: review_summit_line
    type: review
    title: "Summit Line: a platformer that knows how to care"
    author: speedrun_lena
    ago: 6d
    views: 1960
    fields:
      field_game: summit_line
      field_verdict: masterpiece
      field_platforms: [PC, Nintendo Switch]
      field_image: {file: images/review-summit-line.webp}
      field_body: |
        <p>Summit Line demands frame-perfect precision - and doesn't punish you for it. Every screen is a small puzzle, a death sends you back to its start in a second, and the death counter at the end of a chapter reads like a medal, not a reproach.</p>
        <h2>A mountain as a metaphor</h2>
        <p>The story of the climber and her doubts is told without preaching. The mechanics and the story say the same thing: climbing is hard but possible, and there's no shame in asking for help - that's what the assist mode is for.</p>
      field_pros: |
        <ul><li>Flawless controls</li><li>Fair but high difficulty</li><li>A touching story and a superb soundtrack</li></ul>
      field_cons: |
        <ul><li>The extra levels are for the most stubborn only</li></ul>
    comments:
      - author: pixel_kid
        body: Chapter eight broke two of my gamepads. No regrets.
        replies:
          - author: speedrun_lena
            body: And that's not all the feathers yet!
  - key: review_rain_precinct
    type: review
    title: "Rain Precinct: a role-playing game where the main enemy is you"
    author: quest_master
    ago: 14d
    views: 1710
    fields:
      field_game: rain_precinct
      field_verdict: great
      field_platforms: [PC]
      field_image: {file: images/review-rain-precinct.webp}
      field_body: |
        <p>Rain Precinct has no fights, but it has a dozen voices in the detective's head. Reason suggests a theory, Bravado advises a lie, Craving asks for a drink - and any of them may turn out right.</p>
        <p>It's a game you read. There's a lot of text, and it's excellent: funny, bitter and unexpectedly human. Failing a check here is often more interesting than passing it.</p>
      field_pros: |
        <ul><li>The best writing in the genre</li><li>Failure is a story too</li><li>A city you believe in</li></ul>
      field_cons: |
        <ul><li>A slow start</li><li>Little action for those waiting for battles</li></ul>
  - key: review_orbit_loop
    type: review
    title: "Orbit Loop: a game you can finish only once"
    author: night_owl
    ago: 11d
    views: 2050
    fields:
      field_game: orbit_loop
      field_verdict: masterpiece
      field_platforms: [PC, PlayStation 5]
      field_image: {file: images/review-orbit-loop.webp}
      field_body: |
        <p>Orbit Loop has no new abilities, weapons or experience points. All you gain is knowledge. That's why it's so hard to write about: every detail takes a discovery away from the reader.</p>
        <p>Let's just say that twenty minutes is a lot if you know where to fly. And that behind the patched-up little ship stands one of the best stories in games.</p>
      field_pros: |
        <ul><li>Discoveries you make yourself</li><li>Every planet is a puzzle of its own</li><li>An ending you'll remember</li></ul>
      field_cons: |
        <ul><li>Flying the ship fights you at first</li></ul>
    comments:
      - author: retro_anna
        body: Thanks for no spoilers. Off to buy it.
  - key: review_card_tower
    type: review
    title: "Card Tower: the deck that builds you"
    author: galaga_pro
    ago: 26d
    views: 1180
    fields:
      field_game: card_tower
      field_verdict: great
      field_platforms: [PC]
      field_image: {file: images/review-card-tower.webp}
      field_body: |
        <p>The main skill in Card Tower is saying no. Don't take the card that looks strong, don't go for the chest if an elite enemy stands in the way. A good deck is a thin deck.</p>
        <p>The four characters play completely differently, and the higher difficulty levels give a reason to come back for years.</p>
      field_pros: |
        <ul><li>Clear rules and fair randomness</li><li>Four very different characters</li></ul>
      field_cons: |
        <ul><li>Modest graphics</li></ul>
  - key: review_neon_courier
    type: review
    title: "\"Neon Courier\": pretty, fast and empty"
    author: sofa_critic
    ago: 25d
    views: 1420
    fields:
      field_game: neon_courier
      field_verdict: miss
      field_platforms: [PC]
      field_image: {file: images/review-neon-courier.webp}
      field_body: |
        <p>The first hour of "Neon Courier" promises a lot: glowing streets, music from a night radio, a scooter that's a joy to ride. By the second hour you see that the orders repeat and the city behind the neon is empty.</p>
        <p>The chases with rivals get old fast, and the story ends just when it gets interesting. A pity: the game has a good base.</p>
      field_pros: |
        <ul><li>Style and music</li><li>Pleasant controls</li></ul>
      field_cons: |
        <ul><li>Repetitive orders</li><li>An empty open world</li><li>A short story</li></ul>
    comments:
      - author: joystick_dad
        body: My son liked it, but then he's thrilled by pizza delivery in real life too.
      - author: night_owl
        body: I'll wait for a sale and a couple of patches.
        replies:
          - author: galaga_pro
            body: The patch is already out, there's a news item about it.
  - key: review_shifting_keep
    type: review
    title: "Shifting Keep: a roguelike for those who love a fight"
    author: pixel_kid
    ago: 33d
    views: 990
    fields:
      field_game: shifting_keep
      field_verdict: fine
      field_platforms: [Nintendo Switch]
      field_image: {file: images/review-shifting-keep.webp}
      field_body: |
        <p>The fights in Shifting Keep are among the best in the genre: fast, responsive, with hundreds of weapons. But you play the first biomes so often that by the twentieth run they turn into a routine.</p>
      field_pros: |
        <ul><li>Excellent combat</li><li>Lots of weapons and builds</li></ul>
      field_cons: |
        <ul><li>The same start of every run</li><li>Slow growth of power</li></ul>

